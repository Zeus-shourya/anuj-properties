<section class="section section--tight" aria-labelledby="cta-title">
  <div class="container">
    <div class="band band--dark">
      <span class="band__corner" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">In Sonipat since 1998</p>
        <h2 id="cta-title">Tell us what you're looking for</h2>
        <p>Call or WhatsApp, or walk into our office at A Block, Parsvnath City. We're open every day, 10:30 am to 7:30 pm.</p>
      </div>
      <div class="btn-row">
        <a class="btn btn--wa" href="{{waPage}}" data-track="whatsapp"><svg aria-hidden="true"><use href="#i-whatsapp"/></svg>WhatsApp us</a>
        <a class="btn btn--accent" href="{{tel}}" data-track="call"><svg class="i" aria-hidden="true"><use href="#i-phone"/></svg>Call {{phone}}</a>
      </div>
    </div>
  </div>
</section>
